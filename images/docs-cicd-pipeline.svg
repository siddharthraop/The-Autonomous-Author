<svg width="720" style="background:#ffffff" viewBox="0 0 720 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Docs CI/CD pipeline. Every docs pull request runs the required checks and gets a preview URL, then a writer and SME approve. Merge deploys to staging. The release tag publishes to production. Live checks feed drift and link problems back to the next doc kickoff."><defs><marker id="pl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="plp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4a40b0" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="plt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0a6b52" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="pla" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b07010" stroke-width="1.5" stroke-linecap="round"/></marker><marker id="plc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b03820" stroke-width="1.5" stroke-linecap="round"/></marker></defs><text x="20" y="14" text-anchor="start" font-family="IBM Plex Mono,monospace" font-size="9" fill="#8a8880">DOCS CI · EVERY DOCS PULL REQUEST</text><rect x="20" y="44" width="155" height="52" rx="6" fill="#f0effe" stroke="#b0a8e8" stroke-width="0.75"/><text x="97.5" y="67.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#4a40b0">Docs PR opened</text><text x="97.5" y="82.0" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="#4a40b0">agent draft or writer edit</text><rect x="195" y="44" width="155" height="52" rx="6" fill="#fdf4e3" stroke="#e8c870" stroke-width="0.75"/><text x="272.5" y="67.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#b07010">Required checks</text><text x="272.5" y="82.0" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="#b07010">docs-checks.yml</text><rect x="370" y="44" width="155" height="52" rx="6" fill="#e8f5f0" stroke="#80c8b0" stroke-width="0.75"/><text x="447.5" y="67.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#0a6b52">Preview build</text><text x="447.5" y="82.0" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="#0a6b52">Firebase preview URL</text><rect x="545" y="44" width="155" height="52" rx="6" fill="#e8f5f0" stroke="#80c8b0" stroke-width="0.75"/><text x="622.5" y="67.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#0a6b52">Writer and SME</text><text x="622.5" y="82.0" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="#0a6b52">review · approve</text><line x1="175" y1="70" x2="191" y2="70" stroke="#8a8880" stroke-width="0.75" marker-end="url(#pl)"/><line x1="350" y1="70" x2="366" y2="70" stroke="#8a8880" stroke-width="0.75" marker-end="url(#pl)"/><line x1="525" y1="70" x2="541" y2="70" stroke="#8a8880" stroke-width="0.75" marker-end="url(#pl)"/><rect x="197" y="104" width="37.0" height="16" rx="8" fill="#fdf4e3" stroke="#e8c870" stroke-width="0.6"/><text x="215.5" y="115" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8" fill="#b07010">style</text><rect x="237.0" y="104" width="58.6" height="16" rx="8" fill="#fdf4e3" stroke="#e8c870" stroke-width="0.6"/><text x="266.3" y="115" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8" fill="#b07010">grounding</text><rect x="298.6" y="104" width="37.0" height="16" rx="8" fill="#fdf4e3" stroke="#e8c870" stroke-width="0.6"/><text x="317.1" y="115" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8" fill="#b07010">build</text><rect x="197" y="123" width="37.0" height="16" rx="8" fill="#fdf4e3" stroke="#e8c870" stroke-width="0.6"/><text x="215.5" y="134" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8" fill="#b07010">links</text><rect x="237.0" y="123" width="37.0" height="16" rx="8" fill="#fdf4e3" stroke="#e8c870" stroke-width="0.6"/><text x="255.5" y="134" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8" fill="#b07010">score</text><text x="372" y="115" text-anchor="start" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="#0a6b52">expires after 7 days</text><text x="547" y="115" text-anchor="start" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="#0a6b52">branch protection</text><path d="M272 44 C 272 22, 98 22, 98 40" fill="none" stroke="#b03820" stroke-width="0.9" stroke-dasharray="4 3" marker-end="url(#plc)"/><text x="284" y="32" text-anchor="start" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="#b03820">fail: fix and push again</text><path d="M622 96 L622 148 L82 148 L82 172" fill="none" stroke="#8a8880" stroke-width="0.75" marker-end="url(#pl)"/><text x="110" y="168" text-anchor="start" font-family="IBM Plex Mono,monospace" font-size="9" fill="#8a8880">DOCS CD · ON MERGE AND ON RELEASE</text><rect x="20" y="176" width="124" height="52" rx="6" fill="#e8f5f0" stroke="#80c8b0" stroke-width="0.75"/><text x="82.0" y="199.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#0a6b52">Merge to main</text><text x="82.0" y="214.0" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="#0a6b52">writer merges</text><rect x="159" y="176" width="124" height="52" rx="6" fill="#ffffff" stroke="#d8d5ce" stroke-width="0.75"/><text x="221.0" y="199.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#1a1917">Staging site</text><text x="221.0" y="214.0" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="#1a1917">deploy on merge</text><rect x="298" y="176" width="124" height="52" rx="6" fill="#eaf2fe" stroke="#90b8e8" stroke-width="0.75"/><text x="360.0" y="199.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#1850a0">Release tag</text><text x="360.0" y="214.0" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="#1850a0">on push of tag v*</text><rect x="437" y="176" width="124" height="52" rx="6" fill="#e8f5f0" stroke="#80c8b0" stroke-width="0.75"/><text x="499.0" y="199.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#0a6b52">Production</text><text x="499.0" y="214.0" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="#0a6b52">docs publish</text><rect x="576" y="176" width="124" height="52" rx="6" fill="#f0effe" stroke="#b0a8e8" stroke-width="0.75"/><text x="638.0" y="199.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#4a40b0">Live checks</text><text x="638.0" y="214.0" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="#4a40b0">links · drift · score</text><line x1="144" y1="202" x2="155" y2="202" stroke="#8a8880" stroke-width="0.75" marker-end="url(#pl)"/><line x1="283" y1="202" x2="294" y2="202" stroke="#8a8880" stroke-width="0.75" marker-end="url(#pl)"/><line x1="422" y1="202" x2="433" y2="202" stroke="#8a8880" stroke-width="0.75" marker-end="url(#pl)"/><line x1="561" y1="202" x2="572" y2="202" stroke="#8a8880" stroke-width="0.75" marker-end="url(#pl)"/><text x="360" y="248" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#5a5852">The code release tag that ships the feature also publishes its docs.</text><path d="M638 228 L638 266 L82 266 L82 232" fill="none" stroke="#4a40b0" stroke-width="0.9" stroke-dasharray="4 3" marker-end="url(#plp)"/><text x="360" y="280" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="#4a40b0">feedback: drift issues and broken links go to the next doc kickoff</text></svg>