# Build the demo API image, prove it drafts a sample feature, push it, deploy it to Cloud Run.
name: deploy-api
on:
  push:
    branches: [main]
    paths: ["author/**", "api/**", "sample/**", "vendor/**", "Dockerfile", "pyproject.toml", ".vale.ini", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:
concurrency:
  group: deploy-api
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write   # Workload Identity Federation to Google Cloud
env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE: author-api
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t author-api:ci .
      - name: Smoke test the container (no model key)
        run: |
          docker run -d --name api -p 8080:8080 author-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
          curl -sf -X POST localhost:8080/api/features -H 'Content-Type: application/json' -d '{"sample":"default"}' | tail -1 > done.json
          python3 -c "import json; r=json.load(open('done.json'))['result']; assert r['score']['total']==10.0, r['score']; assert not r['dita_errors'], r['dita_errors']; assert all(e['ok'] for e in r['expected']); print('smoke ok', r['score'])"
          docker logs api | tail -5
          echo "Image size: $(docker image inspect author-api:ci --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1e6}')"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Push
        id: push
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT }}/tw-images/author-api:${GITHUB_SHA::12}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker tag author-api:ci "$IMAGE" && docker push -q "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Deploy (0 to 1 instance, request-based billing)
        run: |
          gcloud run deploy "$SERVICE" --project="${{ vars.GCP_PROJECT }}" --region="$REGION" \
            --image="${{ steps.push.outputs.image }}" \
            --service-account="${{ vars.GCP_RUNTIME_SA || format('manifest-run@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT) }}" \
            --min-instances=0 --max-instances=1 --cpu-throttling --concurrency=8 --timeout=300 \
            --cpu=1 --memory=1Gi --port=8080 \
            --set-secrets="GOOGLE_API_KEY=gemini-api-key:latest" \
            --set-env-vars="AUTHOR_MODEL=gemini-3.8-flash" \
            --labels="project=autonomous-author,managed-by=deploy-api" --quiet
          URL=$(gcloud run services describe "$SERVICE" --project="${{ vars.GCP_PROJECT }}" --region="$REGION" --format='value(status.url)')
          echo "Service URL: $URL"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health")
          echo "Public health check: HTTP $code"
          if [ "$code" = "403" ]; then
            echo "::warning title=Not public yet::Run once: gcloud run services add-iam-policy-binding $SERVICE --region=$REGION --member=allUsers --role=roles/run.invoker"
          fi
