name: tests
on:
  push:
    branches: [main]
    paths: ["author/**", "api/**", "sample/**", "tests/**", "pyproject.toml", ".github/**"]
  pull_request:
    paths: ["author/**", "tests/**", "pyproject.toml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-author
      - run: |
          python -m pytest -q -rf tests 2>&1 | tee pytest.log; status=${PIPESTATUS[0]}
          grep -E "^FAILED|Error" pytest.log | head -5 | while read -r l; do echo "::error title=test failed::$l"; done
          exit $status
