# Release and deploy: merge goes to staging; the code release tag publishes to production (§5.2).
name: docs-deploy
on:
  push:
    branches: [main]
    paths: ["docs/**"]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -e . && python -m sphinx -W -q -b html docs docs/_build/html
      - name: Staging (on merge)
        if: env.FIREBASE_SA != '' && github.ref_type == 'branch'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT }}
          channelId: staging
          expires: 30d
      - name: Production (on release tag)
        if: env.FIREBASE_SA != '' && github.ref_type == 'tag'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT }}
          channelId: live
      - name: No Firebase yet
        if: env.FIREBASE_SA == ''
        run: echo "FIREBASE_SERVICE_ACCOUNT is not set; the site built but was not deployed."
