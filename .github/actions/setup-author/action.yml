name: Set up the Autonomous Author
description: Python, the engine, Vale with the Google package, and lychee.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
    - shell: bash
      run: pip install -q -e ".[model,test]" vale
    - shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/lychee"
        curl -sSfL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.21.0/lychee-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$RUNNER_TEMP/lychee"
        sudo mv "$(find "$RUNNER_TEMP/lychee" -name lychee -type f | head -1)" /usr/local/bin/lychee
        vale sync
        vale --version && lychee --version
